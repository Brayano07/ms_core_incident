server:
  port: 9090

spring:
  application:
    name: ms_core_incident

  webflux:
    base-path: /route

  cloud:
    function:
      definition: incidentFeedConsumer

    stream:
      kafka:
        binder:
          brokers: localhost:9092

      bindings:
        incidentFeedConsumer-in-0:
          destination: incident-feed-events
          group: incident-feed-group
          content-type: application/json

  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0

  cache:
    type: redis
    redis:
      time-to-live: 3600000